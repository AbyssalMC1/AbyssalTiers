<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Abyssal Tiers</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>

<div class="background"></div>


<header class="navbar">

    <div class="logo">

        <span class="logo-main">
            ABYSSAL
        </span>

        <span class="logo-sub">
            TIERS
        </span>

    </div>


    <nav>

        <a href="#overallSection">
            Overall
        </a>

        <a href="#modesSection">
            Gamemodes
        </a>

    </nav>

</header>



<main>


    <!-- HERO -->

    <section class="hero">

        <div>

            <div class="small-title">
                MINECRAFT PVP RANKINGS
            </div>

            <h1>
                Abyssal
                <span>Tiers</span>
            </h1>

            <p>
                Custom Minecraft PvP rankings.
            </p>

        </div>

    </section>



    <!-- OVERALL -->

    <section id="overallSection">

        <div class="section-title">

            <div>

                <span class="section-small">
                    RANKINGS
                </span>

                <h2>
                    Overall
                </h2>

            </div>

            <div
                id="overallPlayerCount"
                class="player-count">
            </div>

        </div>


        <div
            id="overallLeaderboard"
            class="leaderboard">
        </div>

    </section>



    <!-- GAMEMODES -->

    <section id="modesSection">

        <div class="section-title">

            <div>

                <span class="section-small">
                    GAME MODES
                </span>

                <h2>
                    PvP Gamemodes
                </h2>

            </div>

        </div>


        <div
            id="gamemodeGrid"
            class="gamemode-grid">
        </div>

    </section>



    <!-- GAMEMODE PAGE -->

    <section
        id="gamemodePage"
        class="hidden">

        <a
            href="#modesSection"
            class="back-button">

            ← Back to Gamemodes

        </a>


        <div class="gamemode-header">

            <span class="section-small">
                GAMEMODE
            </span>

            <h2 id="gamemodeTitle">
                Sword
            </h2>

            <p id="gamemodeDescription">
            </p>

        </div>


        <div
            id="gamemodeLeaderboard"
            class="leaderboard">
        </div>

    </section>



    <!-- PLAYER PROFILE -->

    <section
        id="playerProfile"
        class="hidden">
    </section>


</main>



<footer>

    <strong>
        Abyssal Tiers
    </strong>

    <span>
        Custom Minecraft PvP Rankings
    </span>

</footer>



<script src="data.js"></script>

<script src="script.js"></script>


</body>

</html>
